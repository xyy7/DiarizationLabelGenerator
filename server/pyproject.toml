[project]
name = "adg-server"
version = "0.1.0"
description = "Speaker diarization annotation server for producing RTTM test sets"
requires-python = ">=3.10"

# The api image deliberately has no torch: peaks and audio handling need only
# numpy/soundfile/av. Torch lives in the worker image alone.
#
# av (PyAV) bundles FFmpeg's libraries in its wheel and soundfile bundles
# libsndfile in its own, so the image needs no system packages whatsoever.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<2",
    "soundfile>=0.12",
    "av>=11,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
