# Minimal Alembic configuration. The app never reads this file at runtime:
# app.db builds its own Config with script_location = server/migrations (so the
# path is right no matter the working directory). This file exists for the
# developer commands run by hand:
#
#   cd server && alembic revision --autogenerate -m "describe change"
#   docker compose exec api alembic upgrade head
#
# The database URL comes from the app configuration via migrations/env.py
# (DATABASE_URL env var à la app/config.py) -- the standard `sqlalchemy.url`
# ini option is deliberately absent so it can never contradict the app.

[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
